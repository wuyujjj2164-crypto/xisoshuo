# AI 小说转剧本工具配置

# Anthropic API 配置（Claude 系列模型）
anthropic:
  api_key: ""           # 留空则从环境变量 ANTHROPIC_API_KEY 读取
  model: "claude-sonnet-4-6"  # 使用的模型
  max_tokens: 4096      # 单次请求最大 token
  temperature: 0.3      # 创造性程度 (0.0-1.0)

# OpenAI 兼容 API 配置（DeepSeek / 通义千问 / GPT 等）
openai:
  api_key: ""           # 留空则从环境变量 OPENAI_API_KEY 读取
  base_url: ""          # API 基础地址，如：https://api.deepseek.com/v1
  model: "gpt-4o"       # 使用的模型
  max_tokens: 4096
  temperature: 0.3

# AI 分析器配置
ai_analyzer:
  enabled: false        # 是否默认启用 AI 分析
  provider: "anthropic" # 分析器使用的 API：anthropic / openai

# 转换配置
conversion:
  chapters_per_batch: 3  # 每批处理的章节数
  scenes_per_act: 5      # 每幕建议场次数
  min_scene_length: 100  # 最小场景字数

# 输出配置
output:
  format: "yaml"         # 输出格式
  indent: 2              # YAML 缩进
  default_width: 80      # 行宽限制
