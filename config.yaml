# AI 小说转剧本工具配置

# Anthropic API 配置
anthropic:
  api_key: ""           # 留空则从环境变量 ANTHROPIC_API_KEY 读取
  model: "claude-sonnet-4-6"  # 使用的模型
  max_tokens: 4096      # 单次请求最大 token
  temperature: 0.3      # 创造性程度 (0.0-1.0)

# 转换配置
conversion:
  chapters_per_batch: 3  # 每批处理的章节数
  scenes_per_act: 5      # 每幕建议场次数
  min_scene_length: 100  # 最小场景字数

# 输出配置
output:
  format: "yaml"         # 输出格式
  indent: 2              # YAML 缩进
  default_width: 80      # 行宽限制
